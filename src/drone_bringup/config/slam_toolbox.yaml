slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 12.0
    use_map_saver: true
    map_file_name: /tmp/maze_map
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: false
    transform_publish_period: 0.02
    map_update_interval: 1.0
